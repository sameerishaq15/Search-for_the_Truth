<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search for the truth</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #1a472a; margin-bottom: 5px; }
        p { color: #666; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; background: #1a472a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #2d5a3f; }
        #result { margin-top: 25px; text-align: left; }
        .hadith-card { background: #f9f9f9; border-left: 5px solid #1a472a; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .ref { font-weight: bold; color: #1a472a; font-size: 14px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Search for the truth</h1>
        <p>Authentic Hadith Search (Bukhari & Muslim)</p>
        <input type="text" id="searchInput" placeholder="Search topic (e.g. Prayer, Manners)...">
        <button onclick="handleSearch()">Search References</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
