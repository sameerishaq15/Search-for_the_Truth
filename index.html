<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search for the truth</title>
    <style>
        :root { --primary: #1a472a; --gold: #c5a059; --bg: #f4f1ea; }
        body { font-family: 'Georgia', serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; border-top: 8px solid var(--primary); }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 10px; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 5px; }
        .tagline { color: var(--gold); font-style: italic; margin-bottom: 30px; font-weight: bold; }
        input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 30px; font-size: 16px; margin-bottom: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; }
        button:hover { background: #2d5a3f; transform: translateY(-2px); }
        #result { margin-top: 30px; text-align: left; }
        .hadith-card { background: #fff; border: 1px solid #eee; border-left: 6px solid var(--gold); padding: 20px; margin-bottom: 20px; border-radius: 10px; position: relative; }
        .source-label { position: absolute; top: -10px; right: 10px; background: var(--gold); color: white; padding: 2px 10px; font-size: 12px; border-radius: 5px; }
        .error-msg { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Search for the truth</h1>
        <p class="tagline">Assalamu Alaikum - Authentic Hadith & Quranic Search</p>
        <input type="text" id="searchInput" placeholder="Search (e.g. Prayer, Manners, Charity)...">
        <button onclick="handleSearch()">Search References</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
